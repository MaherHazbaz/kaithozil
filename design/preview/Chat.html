<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Tamil:wght@400;600;700&amp;family=Anton&amp;family=Bebas+Neue&amp;display=swap">

<title>Chat with your worker</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Tamil:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4C1D95}a:hover{color:#3B1574}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #F3EEFB 0%, #F8F7FB 35%, #FFFFFF 100%); font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', sans-serif; color: #1C1730; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 22px 16px 12px 16px; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-bottom: 1px solid #E8E5F0">
  <a href="Tracking.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #FFFFFF; border: 1px solid #E8E5F0; display: flex; align-items: center; justify-content: center; color: #1C1730"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
  <div style="width: 42px; height: 42px; flex-shrink: 0; border-radius: 21px; background: #FEF3C7; color: #7C4A03; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">MK</div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 16px; font-weight: 800">Murugan K.</span><span style="font-size: 12px; color: #625B73">On the way · about 9 min</span></div>
  <button aria-label="Call Murugan (your number stays private)" onClick="" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></button>
</div>

<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
  <div style="align-self: center; display: flex; align-items: center; gap: 6px; background: #EFE9FB; color: #4C1D95; border-radius: 999px; padding: 6px 12px; font-size: 11px; font-weight: 700"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Chat is open during your job. Numbers stay private.</div>
  <div style="align-self: flex-start; max-width: 78%; background: #FFFFFF; border: 1px solid #E8E5F0; color: #1C1730; border-radius: 18px 18px 18px 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; line-height: 1.4">Vanakkam! I'm on my way. Reaching in about 10 minutes.</span><span style="font-size: 10px; color: #625B73">4:21 PM</span></div>
  <div style="align-self: flex-end; max-width: 78%; background: #4C1D95; color: #FFFFFF; border-radius: 18px 18px 4px 18px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; line-height: 1.4">Okay, thank you.</span><span style="font-size: 10px; color: #DDD3F5; align-self: flex-end">4:22 PM</span></div>
  <div style="align-self: flex-start; background: #FFFFFF; border: 1px solid #EEEAF6; border-radius: 20px; box-shadow: 0 8px 24px rgba(59, 21, 116, 0.08) 18px 18px 4px; padding: 8px 12px; display: flex; align-items: center; gap: 10px"><button aria-label="Play voice message" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #4C1D95; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg></button><div style="display: flex; align-items: center; gap: 3px" aria-hidden="true"><span style="width: 3px; height: 8px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 14px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 20px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 10px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 22px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 16px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 9px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 18px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 12px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 20px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 8px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 14px; border-radius: 2px; background: #4C1D95"></span></div><span style="font-size: 11px; color: #625B73">0:12</span></div>
  
</div>
<div style="padding: 10px 16px 0 16px; display: flex; gap: 8px; overflow-x: auto; flex-shrink: 0" role="group" aria-label="Quick replies"><button onClick="" style="flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #4C1D95; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap">Please come to the back gate</button><button onClick="" style="flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #4C1D95; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap">Call me when you arrive</button><button onClick="" style="flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #4C1D95; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap">My neighbour will open the door</button><button onClick="" style="flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #4C1D95; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap">Running 5 minutes late</button></div>
<div style="padding: 10px 16px 24px 16px; display: flex; gap: 8px; align-items: center; flex-shrink: 0">
  <label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
  <input id="msg" type="text" placeholder="Type a message" value="" onInput="" style="flex-grow: 1; min-width: 0; height: 48px; border-radius: 24px; border: 1px solid #DDD8E8; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 15px; color: #1C1730; box-sizing: border-box">
  <button aria-label="Record a voice message" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #4C1D95; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg></button>
  <button aria-label="Send message" onClick="" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg></button>
</div>
</div>
