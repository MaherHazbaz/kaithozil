<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Tamil:wght@400;600;700&amp;family=Anton&amp;family=Bebas+Neue&amp;display=swap">
<meta charset="utf-8">
<title>Add or edit address</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Tamil:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4C1D95}a:hover{color:#3B1574}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #F3EEFB 0%, #F8F7FB 35%, #FFFFFF 100%); font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', sans-serif; color: #1C1730; display: flex; flex-direction: column; overflow: hidden">

<div style="position: relative; height: 250px; flex-shrink: 0; overflow: hidden"><svg width="100%" height="250" viewBox="0 0 390 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block; width: 100%"><rect width="390" height="250" fill="#ECE8F4"></rect><g stroke="#FFFFFF" stroke-width="14"><line x1="0" y1="70" x2="390" y2="55"></line><line x1="0" y1="180" x2="390" y2="195"></line><line x1="95" y1="0" x2="115" y2="250"></line><line x1="290" y1="0" x2="270" y2="250"></line></g><g fill="#DCD5EA"><rect x="130" y="85" width="50" height="40" rx="4"></rect><rect x="200" y="80" width="55" height="45" rx="4"></rect><rect x="135" y="140" width="45" height="30" rx="4"></rect><rect x="300" y="90" width="60" height="70" rx="4"></rect><rect x="15" y="90" width="65" height="70" rx="4"></rect></g><circle cx="195" cy="150" r="22" fill="#4C1D95" fill-opacity="0.15"></circle></svg><div aria-hidden="true" style="position: absolute; left: 50%; top: 50%; margin: -46px 0 0 -18px; width: 36px; height: 46px; color: #4C1D95"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#4C1D95" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg></div>
<a href="Addresses.dc.html" aria-label="Back" style="position: absolute; top: 22px; left: 20px; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1C1730; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
<div style="position: absolute; top: 28px; left: 76px; right: 20px; height: 34px; border-radius: 999px; background: rgba(28, 23, 48, 0.78); color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 12px">Move the map to place the pin</div>
<button onClick="" style="position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%); height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: #FFFFFF; color: #4C1D95; font-family: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22"></line><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="3"></circle></svg>Use my current location</button>
</div>
<div style="flex-grow: 1; min-height: 0; background: #F8F7FB; border-radius: 24px 24px 0 0; margin-top: -24px; position: relative; padding: 18px 20px 16px 20px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto">
  <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 20px; font-weight: 800">Add address</div><div style="font-size: 12px; color: #625B73">முகவரியைச் சேர்க்கவும்</div></div>
  <div style="display: flex; gap: 10px; align-items: flex-start; background: #FFFFFF; border: 1px solid #E8E5F0; border-radius: 14px; padding: 10px 12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4C1D95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg><div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 700">4th Street, Anna Nagar</span><span style="font-size: 12px; color: #625B73">Chennai, Tamil Nadu 600040</span></div></div>
  <div style="display: flex; flex-direction: column; gap: 6px"><label for="house" style="font-size: 13px; font-weight: 700; color: #625B73">House or flat number · வீட்டு எண்</label><input id="house" type="text" placeholder="e.g. 12, 2nd floor" onInput="" style="height: 48px; border-radius: 12px; border: 1px solid #DDD8E8; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #1C1730; box-sizing: border-box; width: 100%"></div>
  <div style="display: flex; flex-direction: column; gap: 6px"><label for="landmark" style="font-size: 13px; font-weight: 700; color: #625B73">Landmark (optional) · அடையாளம்</label><input id="landmark" type="text" placeholder="e.g. Near Tower Park" style="height: 48px; border-radius: 12px; border: 1px solid #DDD8E8; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #1C1730; box-sizing: border-box; width: 100%"></div>
  <div style="display: flex; flex-direction: column; gap: 6px"><div style="font-size: 13px; font-weight: 700; color: #625B73">Save as</div><div style="display: flex; flex-wrap: wrap; gap: 6px" role="group" aria-label="Save as"><button aria-pressed="true" onClick="" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #4C1D95; background: #EFE9FB; color: #4C1D95; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Home</button><button aria-pressed="false" onClick="" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #1C1730; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Office</button><button aria-pressed="false" onClick="" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #1C1730; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Other</button></div></div>
  <button aria-pressed="false" onClick="" style="width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px; background: #FFFFFF; border: 1px solid #E8E5F0; border-radius: 14px; font-family: inherit; color: #1C1730; text-align: left; cursor: pointer"><span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Make this my default address</span><span style="font-size: 12px; color: #625B73">Used first when you book</span></span><span style="width: 52px; height: 30px; flex-shrink: 0; border-radius: 15px; background: #CFC9DC; display: flex; align-items: center; justify-content: flex-start; padding: 3px; box-sizing: border-box"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></button>
</div>
<div style="padding: 14px 20px 26px 20px; background: #FFFFFF; border-top: 1px solid #E8E5F0; display: flex; flex-direction: column; gap: 10px"><a href="#" aria-disabled="true" style="height: 56px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 16px; font-weight: 700; text-decoration: none; cursor: default; opacity: 0.5; pointer-events: none; box-sizing: border-box">Save address</a><div style="font-size: 12px; color: #625B73; text-align: center">Add your house or flat number to save</div></div>
</div>

</html>
