<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat with your worker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Tamil:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4C1D95}a:hover{color:#3B1574}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #F3EEFB 0%, #F8F7FB 35%, #FFFFFF 100%); font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', sans-serif; color: #1C1730; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 22px 16px 12px 16px; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-bottom: 1px solid #E8E5F0">
  <a href="Tracking.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #FFFFFF; border: 1px solid #E8E5F0; display: flex; align-items: center; justify-content: center; color: #1C1730"><svg style="flex-shrink: 0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
  <div style="width: 42px; height: 42px; flex-shrink: 0; border-radius: 21px; background: #FEF3C7; color: #7C4A03; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">MK</div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 16px; font-weight: 800">Murugan K.</span><span style="font-size: 12px; color: #625B73">On the way · about 9 min</span></div>
  <button aria-label="Call Murugan (your number stays private)" onClick="{{call}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg style="flex-shrink: 0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></button>
</div>
<sc-if value="{{calling}}" hint-placeholder-val="{{ false }}"><div role="status" style="margin: 10px 16px 0 16px; background: linear-gradient(160deg, #6A3BB5 0%, #4C1D95 50%, #2E0F5E 100%); color: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px"><svg style="flex-shrink: 0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5C76A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg><span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 800">Calling Murugan…</span><span style="font-size: 12px; color: #DDD3F5">Through Kaithozhil. Neither of you sees the other's number.</span></span><button aria-label="End call" onClick="{{endCall}}" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #E5484D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg style="flex-shrink: 0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="22" y1="2" x2="2" y2="22"></line></svg></button></div></sc-if>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
  <div style="align-self: center; display: flex; align-items: center; gap: 6px; background: #EFE9FB; color: #4C1D95; border-radius: 999px; padding: 6px 12px; font-size: 11px; font-weight: 700; flex-shrink: 0"><svg style="flex-shrink: 0" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Chat is open during your job. Numbers stay private.</div>
  <div style="align-self: flex-start; max-width: 78%; background: #FFFFFF; border: 1px solid #E8E5F0; color: #1C1730; border-radius: 18px 18px 18px 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; flex-shrink: 0"><span style="font-size: 14px; line-height: 1.4">Vanakkam! I'm on my way. Reaching in about 10 minutes.</span><span style="font-size: 10px; color: #625B73">4:21 PM</span></div>
  <div style="align-self: flex-end; max-width: 78%; background: #4C1D95; color: #FFFFFF; border-radius: 18px 18px 4px 18px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; flex-shrink: 0"><span style="font-size: 14px; line-height: 1.4">Okay, thank you.</span><span style="font-size: 10px; color: #DDD3F5; align-self: flex-end">4:22 PM</span></div>
  <div style="align-self: flex-start; background: #FFFFFF; border: 1px solid #EEEAF6; border-radius: 20px; box-shadow: 0 8px 24px rgba(59, 21, 116, 0.08) 18px 18px 4px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0"><button aria-label="Play voice message" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #4C1D95; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg style="flex-shrink: 0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg></button><div style="display: flex; align-items: center; gap: 3px" aria-hidden="true"><span style="width: 3px; height: 8px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 14px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 20px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 10px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 22px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 16px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 9px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 18px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 12px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 20px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 8px; border-radius: 2px; background: #4C1D95"></span><span style="width: 3px; height: 14px; border-radius: 2px; background: #4C1D95"></span></div><span style="font-size: 11px; color: #625B73">0:12</span></div>
  <sc-for list="{{msgs}}" as="m" hint-placeholder-count="0"><div style="align-self: flex-end; max-width: 78%; background: #4C1D95; color: #FFFFFF; border-radius: 18px 18px 4px 18px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; flex-shrink: 0"><span style="font-size: 14px; line-height: 1.4">{{m.text}}</span><span style="font-size: 10px; color: #DDD3F5; align-self: flex-end">{{m.time}}</span></div></sc-for>
</div>
<div style="padding: 10px 16px 0 16px; display: flex; gap: 8px; overflow-x: auto; flex-shrink: 0" role="group" aria-label="Quick replies"><sc-for list="{{quick}}" as="qr" hint-placeholder-count="4"><button onClick="{{qr.pick}}" style="flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 999px; white-space: nowrap; border: 1px solid #DDD8E8; background: #FFFFFF; color: #4C1D95; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap">{{qr.label}}</button></sc-for></div>
<div style="padding: 10px 16px 24px 16px; display: flex; gap: 8px; align-items: center; flex-shrink: 0">
  <label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
  <input id="msg" type="text" placeholder="Type a message" value="{{draft}}" onInput="{{onDraft}}" style="flex-grow: 1; min-width: 0; height: 48px; border-radius: 24px; border: 1px solid #DDD8E8; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 15px; color: #1C1730; box-sizing: border-box">
  <button aria-label="Record a voice message" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #4C1D95; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg style="flex-shrink: 0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg></button>
  <button aria-label="Send message" onClick="{{sendDraft}}" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg style="flex-shrink: 0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { msgs: [], draft: '', calling: false }; }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const s = this.state;
    const send = (text) => {
      const t = (text || '').trim();
      if (!t) return;
      const now = new Date();
      const time = now.getHours() % 12 === 0 ? 12 : now.getHours() % 12;
      const stamp = time + ':' + String(now.getMinutes()).padStart(2, '0') + (now.getHours() < 12 ? ' AM' : ' PM');
      this.setState({ msgs: this.state.msgs.concat([{ text: t, time: stamp }]), draft: '' });
    };
    return {
      msgs: s.msgs,
      quick: ["Please come to the back gate", "Call me when you arrive", "My neighbour will open the door", "Running 5 minutes late"].map((q) => ({ label: q, pick: () => send(q) })),
      onDraft: (e) => this.setState({ draft: e && e.target ? e.target.value : '' }),
      draft: s.draft,
      sendDraft: () => send(this.state.draft),
      calling: s.calling,
      call: () => { this.setState({ calling: true }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ calling: false }), 4000); },
      endCall: () => { clearTimeout(this.t); this.setState({ calling: false }); }
    };
  }
}
</script>
</body>
</html>
