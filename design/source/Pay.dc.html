<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pay and rate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Tamil:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#4C1D95}a:hover{color:#3B1574}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #F3EEFB 0%, #F8F7FB 35%, #FFFFFF 100%); font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', sans-serif; color: #1C1730; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 48px 20px 0 20px; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <div style="width: 72px; height: 72px; border-radius: 36px; background: #EFE9FB; color: #4C1D95; display: flex; align-items: center; justify-content: center">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <div style="font-size: 22px; font-weight: 800">Job completed</div>
    <div style="font-size: 14px; color: #625B73; text-align: center">Murugan marked your job as done. Check the work, then pay.</div>
  </div>

  <div style="padding: 24px 20px 0 20px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1; min-height: 0; overflow-y: auto; overflow-x: hidden">
    <div style="background: #FFFFFF; border: 1px solid #EEEAF6; border-radius: 20px; box-shadow: 0 8px 24px rgba(59, 21, 116, 0.08); padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #625B73">Work done</span><span style="font-weight: 600">Fan repair + new regulator</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #625B73">Worker</span><span style="font-weight: 600">Murugan K.</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #625B73">Job ID</span><span style="font-weight: 600">KT-20481</span></div>
      <div style="height: 1px; background: #E8E5F0"></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 700">Total</span><span style="font-size: 30px; font-weight: 800">₹650</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <a href="Bookings.dc.html" style="text-decoration: none; box-sizing: border-box; height: 58px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); box-shadow: 0 10px 24px rgba(76, 29, 149, 0.30); color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg>
        Pay ₹650 with UPI
      </a>
      <div style="font-size: 12px; color: #625B73; text-align: center">Opens your UPI app. Money goes straight to Murugan's bank account.</div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #EEEAF6; border-radius: 20px; box-shadow: 0 8px 24px rgba(59, 21, 116, 0.08); padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 15px; font-weight: 700">How was the work?</div><div style="font-size: 13px; font-weight: 700; color: #B45309">{{ratingText}}</div></div>
      <div style="display: flex; gap: 6px" role="group" aria-label="Rate from 1 to 5 stars"><sc-for list="{{stars}}" as="st" hint-placeholder-count="5"><button aria-label="{{st.label}}" aria-pressed="{{st.pressed}}" onClick="{{st.pick}}" style="{{st.style}}">★</button></sc-for></div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{tags}}" as="tg" hint-placeholder-count="3"><button aria-pressed="{{tg.pressed}}" onClick="{{tg.pick}}" style="{{tg.style}}">{{tg.label}}</button></sc-for></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { rating: 4, tags: [] }; }
  renderVals() {
    const r = this.state.rating;
    const words = ['', 'Poor', 'Okay', 'Good', 'Very good', 'Excellent'];
    const tagNames = ['On time', 'Neat work', 'Fair price'];
    return {
      ratingText: words[r],
      stars: [1, 2, 3, 4, 5].map((n) => ({
        label: n + (n === 1 ? ' star' : ' stars'),
        pressed: n === r ? 'true' : 'false',
        style: n <= r ? 'width: 48px; height: 48px; border-radius: 12px; border: 1px solid #F3D9B5; background: #FEF6EC; color: #B45309; font-size: 24px; cursor: pointer' : 'width: 48px; height: 48px; border-radius: 12px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #8A979E; font-size: 24px; cursor: pointer',
        pick: () => this.setState({ rating: n })
      })),
      tags: tagNames.map((t, k) => {
        const on = this.state.tags.indexOf(k) >= 0;
        return {
          label: t, pressed: on ? 'true' : 'false',
          style: on ? 'height: 44px; padding: 0 12px; font-family: inherit; font-size: 12px; font-weight: 700; border: 2px solid #4C1D95; border-radius: 999px; background: #EFE9FB; color: #4C1D95; cursor: pointer' : 'height: 44px; padding: 0 12px; font-family: inherit; font-size: 12px; font-weight: 600; border: 1px solid #DDD8E8; border-radius: 999px; background: #FFFFFF; color: #1C1730; cursor: pointer',
          pick: () => {
            const s = this.state.tags.slice();
            const j = s.indexOf(k);
            if (j >= 0) s.splice(j, 1); else s.push(k);
            this.setState({ tags: s });
          }
        };
      })
    };
  }
}
</script>
</body>
</html>
