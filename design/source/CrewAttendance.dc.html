<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily attendance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Tamil:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4C1D95}a:hover{color:#3B1574}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #F3EEFB 0%, #F8F7FB 35%, #FFFFFF 100%); font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', sans-serif; color: #1C1730; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 22px 20px 0 20px; display: flex; align-items: center; gap: 12px">
  <a href="MestriHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #FFFFFF; border: 1px solid #E8E5F0; display: flex; align-items: center; justify-content: center; color: #1C1730"><svg style="flex-shrink: 0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
  <div style="flex-grow: 1; display: flex; flex-direction: column"><div style="font-size: 18px; font-weight: 800">Attendance</div><div style="font-size: 12px; color: #625B73">வருகைப் பதிவு</div></div>
  <span style="flex-shrink: 0; font-size: 12px; font-weight: 700; color: #7C4A03; background: #FEF3C7; border-radius: 8px; padding: 4px 8px">Wed 19 Nov</span>
</div><div style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; min-height: 0; overflow-y: auto; overflow-x: hidden">

<div style="display: flex; align-items: center; gap: 10px; background: #F8F7FB; border-radius: 14px; padding: 10px 12px; flex-shrink: 0"><div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; background: #EFE9FB; color: #4C1D95; display: flex; align-items: center; justify-content: center"><svg style="flex-shrink: 0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v2z"></path><path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"></path><path d="M4 15v-3a6 6 0 0 1 6-6"></path><path d="M14 6a6 6 0 0 1 6 6v3"></path></svg></div><div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 700">New house · Anna Nagar · Priya R.</span><span style="font-size: 12px; color: #625B73">Day 3 of 6</span></div></div>
<sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
<div style="background: #FFFFFF; border: 1px solid #EEEAF6; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 24px rgba(59, 21, 116, 0.08); flex-shrink: 0"><div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px; font-weight: 800">Site photo with the team</span><span style="flex-shrink: 0; font-size: 12px; font-weight: 700; color: #4C1D95; background: #EFE9FB; border-radius: 8px; padding: 4px 8px">Required</span></div><div role="img" aria-label="Site photo taken at 8:58 AM" style="height: 140px; border-radius: 14px; background: linear-gradient(135deg, #DDD3F5 0%, #FEF3C7 100%); display: flex; align-items: center; justify-content: center; color: #4C1D95"><svg style="flex-shrink: 0" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#4C1D95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg></div><span style="font-size: 12px; color: #625B73">Taken 8:58 AM · location matched</span></div>
<sc-for list="{{team}}" as="t" hint-placeholder-count="7"><div style="background: #FFFFFF; border: 1px solid #EEEAF6; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 24px rgba(59, 21, 116, 0.08); gap: 8px; padding: 12px 14px; flex-shrink: 0"><div style="display: flex; align-items: center; gap: 10px"><div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: #EFE9FB; color: #4C1D95; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px">{{t.ini}}</div><span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{t.name}}</span><span style="font-size: 11px; color: #625B73">{{t.role}}</span></span></div><div style="display: flex; gap: 6px" role="group" aria-label="Attendance for {{t.name}}"><button aria-pressed="{{t.p0}}" onClick="{{t.pick0}}" style="{{t.s0}}">Present</button><button aria-pressed="{{t.p1}}" onClick="{{t.pick1}}" style="{{t.s1}}">Half day</button><button aria-pressed="{{t.p2}}" onClick="{{t.pick2}}" style="{{t.s2}}">Absent</button></div></div></sc-for>
</sc-if>
<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border: 2px solid #4C1D95; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0"><div style="display: flex; align-items: center; gap: 10px"><span style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 12px; background: #4C1D95; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg style="flex-shrink: 0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 700">Attendance sent to Priya · 9:02 AM</span><span style="font-size: 11px; color: #625B73">{{summary}}</span></span></div></div>
<a href="CrewTeam.dc.html" style="height: 48px; border-radius: 14px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #4C1D95; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box; flex-shrink: 0">Back to the site</a>
</sc-if>

</div><div style="padding: 14px 20px 26px 20px; background: #FFFFFF; border-top: 1px solid #E8E5F0; display: flex; flex-direction: column; gap: 10px"><div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; color: #625B73">{{summary}}</span><span style="font-size: 14px; font-weight: 800; color: #4C1D95">{{days}}</span></div><sc-if value="{{editing}}" hint-placeholder-val="{{ true }}"><button onClick="{{send}}" style="height: 56px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); box-shadow: 0 10px 24px rgba(76, 29, 149, 0.30); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box">Send attendance to Priya</button></sc-if></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { marks: [0, 0, 0, 2, 0, 0, 1], photo: true, sent: false }; }
  renderVals() {
    const s = this.state;
    const team = [["SR", "Selvam R.", "Mestri, mason"], ["KP", "Kumar P.", "Mason"], ["RS", "Raja S.", "Heavy helper"], ["MK", "Mani K.", "Heavy helper"], ["VT", "Velu T.", "Heavy helper"], ["LR", "Lakshmi R.", "Site helper"], ["MD", "Meena D.", "Site helper"]];
    const labels = ['Present', 'Half day', 'Absent'];
    const st = (on, k) => on ? (k === 2 ? 'flex: 1; height: 40px; border-radius: 10px; border: 2px solid #1C1730; background: #F0EDF5; color: #1C1730; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer' : 'flex: 1; height: 40px; border-radius: 10px; border: 2px solid #4C1D95; background: #EFE9FB; color: #4C1D95; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer') : 'flex: 1; height: 40px; border-radius: 10px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #625B73; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer';
    const set = (i, k) => { const m = this.state.marks.slice(); m[i] = k; this.setState({ marks: m }); };
    const present = s.marks.filter((m) => m === 0).length, half = s.marks.filter((m) => m === 1).length;
    return {
      team: team.map((t, i) => ({ ini: t[0], name: t[1], role: t[2], s0: st(s.marks[i] === 0, 0), s1: st(s.marks[i] === 1, 1), s2: st(s.marks[i] === 2, 2), p0: s.marks[i] === 0 ? 'true' : 'false', p1: s.marks[i] === 1 ? 'true' : 'false', p2: s.marks[i] === 2 ? 'true' : 'false', pick0: () => set(i, 0), pick1: () => set(i, 1), pick2: () => set(i, 2) })),
      summary: present + ' present' + (half ? ', ' + half + ' half day' : '') + ', ' + (team.length - present - half) + ' absent',
      days: (present + half * 0.5) + ' worker-days today',
      editing: !s.sent, sent: s.sent, send: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
