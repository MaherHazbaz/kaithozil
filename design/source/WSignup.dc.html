<html lang="en">
<head>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Tamil:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4C1D95}a:hover{color:#3B1574}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #F3EEFB 0%, #F8F7FB 35%, #FFFFFF 100%); font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', sans-serif; color: #1C1730; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 22px 20px 0 20px; display: flex; align-items: center; gap: 12px">
  <a href="Login.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #FFFFFF; border: 1px solid #E8E5F0; display: flex; align-items: center; justify-content: center; color: #1C1730"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
  <div style="flex-grow: 1; display: flex; flex-direction: column"><div style="font-size: 18px; font-weight: 800">Worker sign-up</div><div style="font-size: 12px; color: #625B73">தொழிலாளர் பதிவு</div></div>
  
</div><div style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; min-height: 0; overflow-y: auto; overflow-x: hidden">

<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #625B73"><span>Step 1 of 2 · Your details</span><span>50%</span></div><div style="height: 8px; border-radius: 4px; background: #E8E5F0"><div style="width: 50%; height: 8px; border-radius: 4px; background: #4C1D95"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="nm" style="font-size: 13px; font-weight: 700; color: #625B73">Full name (as on Aadhaar)</label><input id="nm" type="text" value="Murugan K" placeholder="" style="height: 48px; border-radius: 12px; border: 1px solid #DDD8E8; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #1C1730; box-sizing: border-box; width: 100%"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="font-size: 13px; font-weight: 700; color: #625B73">Your trade · உங்கள் தொழில்</div><div style="display: flex; flex-wrap: wrap; gap: 6px" role="group" aria-label="Your trade"><sc-for list="{{trade}}" as="o" hint-placeholder-count="8"><button aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
<div style="display: flex; align-items: center; justify-content: space-between"><div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Years of experience</span><span style="font-size: 12px; color: #625B73">அனுபவம்</span></div><div style="display: flex; align-items: center; gap: 6px"><button aria-label="Less years" onClick="{{lessYears}}" style="width: 44px; height: 44px; border-radius: 12px; font-size: 22px; font-weight: 700; cursor: pointer; border: 1px solid #DDD8E8; background: #FFFFFF; color: #4C1D95">−</button><div style="width: 32px; text-align: center; font-size: 20px; font-weight: 800">{{years}}</div><button aria-label="More years" onClick="{{moreYears}}" style="width: 44px; height: 44px; border-radius: 12px; font-size: 22px; font-weight: 700; cursor: pointer; border: none; background: #4C1D95; color: #FFFFFF">+</button></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="upi" style="font-size: 13px; font-weight: 700; color: #625B73">UPI ID for payments</label><input id="upi" type="text" value="murugan@okaxis" placeholder="" style="height: 48px; border-radius: 12px; border: 1px solid #DDD8E8; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #1C1730; box-sizing: border-box; width: 100%"><div style="font-size: 12px; color: #4C1D95; font-weight: 700; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4C1D95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"></path><path d="m9 12 2 2 4-4"></path></svg> Name on account: MURUGAN K · matches</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="uan" style="font-size: 13px; font-weight: 700; color: #625B73">e-Shram UAN (optional)</label><input id="uan" type="text" value="" placeholder="12-digit number" style="height: 48px; border-radius: 12px; border: 1px solid #DDD8E8; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #1C1730; box-sizing: border-box; width: 100%"></div>

</div><div style="padding: 14px 20px 26px 20px; background: #FFFFFF; border-top: 1px solid #E8E5F0; display: flex; flex-direction: column; gap: 10px"><a href="Consent.dc.html" style="height: 56px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); box-shadow: 0 10px 24px rgba(76, 29, 149, 0.30); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box">Continue</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { trade: 0, years: 12 }; }
  grp(key, labels, multi) {
    const on = 'height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #4C1D95; background: #EFE9FB; color: #4C1D95; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer', off = 'height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #1C1730; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer';
    const sel = this.state[key];
    return labels.map((l, k) => {
      const active = multi ? sel.indexOf(k) >= 0 : sel === k;
      return {
        label: l,
        pressed: active ? 'true' : 'false',
        style: active ? on : off,
        pick: () => {
          if (multi) {
            const s = this.state[key].slice();
            const j = s.indexOf(k);
            if (j >= 0) s.splice(j, 1); else s.push(k);
            this.setState({ [key]: s });
          } else {
            this.setState({ [key]: k });
          }
        }
      };
    });
  }
  renderVals() {
    return {
      trade: this.grp('trade', ["Electrician", "Plumber", "Mason", "Carpenter", "Painter", "AC technician", "Tailor", "Helper"], false),
      years: this.state.years,
      lessYears: () => this.setState({ years: Math.max(0, this.state.years - 1) }),
      moreYears: () => this.setState({ years: Math.min(50, this.state.years + 1) })
    };
  }
}
</script>
</body>
</html>
