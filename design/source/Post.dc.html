<div style="padding: 22px 20px 0 20px; display: flex; align-items: center; gap: 12px">
  <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #FFFFFF; border: 1px solid #E8E5F0; display: flex; align-items: center; justify-content: center; color: #1C1730"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
  <div style="flex-grow: 1; display: flex; flex-direction: column"><div style="font-size: 18px; font-weight: 800">Electrician</div><div style="font-size: 12px; color: #625B73">மின் பணியாளர்</div></div>
  
</div><div style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1; min-height: 0; overflow-y: auto; overflow-x: hidden">

<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 14px; font-weight: 800">What's the problem? <span style="font-weight: 500; color: #625B73">· என்ன பிரச்சனை?</span></div><div style="display: flex; flex-wrap: wrap; gap: 6px" role="group" aria-label="Problem type"><sc-for list="{{prob}}" as="o" hint-placeholder-count="6"><button aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>

<div style="display: flex; gap: 8px"><button style="height: 48px; border-radius: 14px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #4C1D95; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box; flex: 1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>Add photo</button><button style="height: 48px; border-radius: 14px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #4C1D95; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box; flex: 1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>Voice note</button></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 14px; font-weight: 800">When do you need it?</div><div style="display: flex; gap: 8px"><sc-if value="{{nowOn}}" hint-placeholder-val="{{ true }}"><button aria-pressed="true" onClick="{{pickNow}}" style="flex: 1; border-radius: 14px; border: 2px solid #4C1D95; background: #EFE9FB; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-family: inherit; color: #1C1730; text-align: left; cursor: pointer"><span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; color: #4C1D95"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>Now</span><span style="font-size: 12px; color: #625B73">Nearby workers get a call right away</span></button><button aria-pressed="false" onClick="{{pickSchedule}}" style="flex: 1; border-radius: 14px; border: 1px solid #DDD8E8; background: #FFFFFF; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-family: inherit; color: #1C1730; text-align: left; cursor: pointer"><span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; color: #1C1730"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>Schedule</span><span style="font-size: 12px; color: #625B73">Pick a date and time</span></button></sc-if><sc-if value="{{schedOn}}" hint-placeholder-val="{{ false }}"><button aria-pressed="false" onClick="{{pickNow}}" style="flex: 1; border-radius: 14px; border: 1px solid #DDD8E8; background: #FFFFFF; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-family: inherit; color: #1C1730; text-align: left; cursor: pointer"><span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; color: #1C1730"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>Now</span><span style="font-size: 12px; color: #625B73">Nearby workers get a call right away</span></button><button aria-pressed="true" onClick="{{pickSchedule}}" style="flex: 1; border-radius: 14px; border: 2px solid #4C1D95; background: #EFE9FB; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-family: inherit; color: #1C1730; text-align: left; cursor: pointer"><span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; color: #4C1D95"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>Schedule</span><span style="font-size: 12px; color: #625B73">Pick a date and time</span></button></sc-if></div></div>
<div style="background: #FFFFFF; border: 1px solid #E8E5F0; border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4C1D95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg><div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Home</span><span style="font-size: 12px; color: #625B73">12, 4th Street, Anna Nagar</span></div><a href="#" style="font-size: 13px; font-weight: 700">Change</a></div>

</div><div style="padding: 14px 20px 26px 20px; background: #FFFFFF; border-top: 1px solid #E8E5F0; display: flex; flex-direction: column; gap: 10px"><div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #625B73">Estimated cost</span><span style="font-weight: 800">₹400 – 700 · agreed on site</span></div><a href="Searching.dc.html" style="height: 56px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); box-shadow: 0 10px 24px rgba(76, 29, 149, 0.30); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box">{{cta}}</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { prob: 0, now: true }; }
  grp(key, labels, multi) {
    const on = 'height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #4C1D95; background: #EFE9FB; color: #4C1D95; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer', off = 'height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #1C1730; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer';
    const sel = this.state[key];
    return labels.map((l, k) => {
      const active = multi ? sel.indexOf(k) >= 0 : sel === k;
      return {
        label: l,
        pressed: active ? 'true' : 'false',
        style: active ? on : off,
        pick: () => {
          if (multi) {
            const s = this.state[key].slice();
            const j = s.indexOf(k);
            if (j >= 0) s.splice(j, 1); else s.push(k);
            this.setState({ [key]: s });
          } else {
            this.setState({ [key]: k });
          }
        }
      };
    });
  }
  renderVals() {
    return {
      prob: this.grp('prob', ["Fan", "Lights", "Switchboard", "Wiring", "Fuse / MCB", "Other"], false),
      nowOn: this.state.now,
      schedOn: !this.state.now,
      pickNow: () => this.setState({ now: true }),
      pickSchedule: () => this.setState({ now: false }),
      cta: this.state.now ? 'Find an electrician' : 'Schedule an electrician'
    };
  }
}
</script>
</body>
