<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: [false, false, false, false, false] }; }
  renderVals() {
    const s = this.state;
    const req = [true, true, true, false, false];
    const allReq = req.every((r, k) => !r || s.on[k]);
    const missing = allReq ? '' : 'Agree to the required items to continue';
    const mk = (k) => ({
      pressed: s.on[k] ? 'true' : 'false',
      box: s.on[k] ? 'width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; background: #4C1D95; color: #FFFFFF; display: flex; align-items: center; justify-content: center' : 'width: 28px; height: 28px; flex-shrink: 0; box-sizing: border-box; border-radius: 8px; border: 2px solid #DDD8E8; background: #FFFFFF; color: transparent; display: flex; align-items: center; justify-content: center',
      card: s.on[k] ? 'width: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: #FFFFFF; border: 2px solid #4C1D95; border-radius: 18px; font-family: inherit; color: #1C1730; text-align: left; cursor: pointer' : 'width: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: #FFFFFF; border: 1px solid #EEEAF6; border-radius: 18px; font-family: inherit; color: #1C1730; text-align: left; cursor: pointer; box-shadow: 0 8px 24px rgba(59, 21, 116, 0.08)',
      toggle: () => { const o = this.state.on.slice(); o[k] = !o[k]; this.setState({ on: o }); }
    });
    return {
      c0: mk(0), c1: mk(1), c2: mk(2), c3: mk(3), c4: mk(4),
      agreeAll: () => this.setState({ on: req.map((r, k) => r || this.state.on[k]) }),
      cta: 'Agree and continue',
      missing: missing !== '',
      missingText: missing,
      ctaHref: missing === '' ? 'Verify.dc.html' : '#',
      ctaDisabled: missing === '' ? 'false' : 'true',
      ctaStyle: missing === '' ? 'height: 56px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); box-shadow: 0 10px 24px rgba(76, 29, 149, 0.30); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box' : 'height: 56px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 16px; font-weight: 700; text-decoration: none; cursor: default; opacity: 0.5; pointer-events: none; box-sizing: border-box',
    };
  }
