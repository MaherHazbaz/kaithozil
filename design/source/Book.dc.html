<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Worker profile and booking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Tamil:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#4C1D95}a:hover{color:#3B1574}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #F3EEFB 0%, #F8F7FB 35%, #FFFFFF 100%); font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', sans-serif; color: #1C1730; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 24px 20px 0 20px; display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E8E5F0; display: flex; align-items: center; justify-content: center; color: #1C1730">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <div style="font-size: 18px; font-weight: 700">Electrician</div>
  </div>

  <div style="padding: 18px 20px 0 20px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1; min-height: 0; overflow-y: auto; overflow-x: hidden">
    <div style="background: #FFFFFF; border: 1px solid #E8E5F0; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; gap: 14px; align-items: center">
        <div style="width: 64px; height: 64px; border-radius: 32px; background: #FEF3C7; color: #7C4A03; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px">MK</div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 20px; font-weight: 800">Murugan K.</div>
          <div style="display: inline-flex; align-items: center; gap: 6px; background: #EFE9FB; color: #4C1D95; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; align-self: flex-start">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"></path><path d="m9 12 2 2 4-4"></path></svg>
            Verified · Level 2
          </div>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="background: #F8F7FB; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px">
          <div style="font-size: 18px; font-weight: 800; color: #B45309">★ 4.8</div>
          <div style="font-size: 12px; color: #625B73">Rating</div>
        </div>
        <div style="background: #F8F7FB; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px">
          <div style="font-size: 18px; font-weight: 800">280</div>
          <div style="font-size: 12px; color: #625B73">Jobs done</div>
        </div>
        <div style="background: #F8F7FB; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px">
          <div style="font-size: 18px; font-weight: 800">12 yrs</div>
          <div style="font-size: 12px; color: #625B73">Experience</div>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <span style="font-size: 12px; font-weight: 600; border: 1px solid #DDD8E8; border-radius: 999px; padding: 5px 10px">Wiring</span>
        <span style="font-size: 12px; font-weight: 600; border: 1px solid #DDD8E8; border-radius: 999px; padding: 5px 10px">Fans &amp; lights</span>
        <span style="font-size: 12px; font-weight: 600; border: 1px solid #DDD8E8; border-radius: 999px; padding: 5px 10px">Inverter</span>
        <span style="font-size: 12px; font-weight: 600; border: 1px solid #DDD8E8; border-radius: 999px; padding: 5px 10px">Tamil, English</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 16px; font-weight: 700">Choose a time</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{slots}}" as="t" hint-placeholder-count="2"><button aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}"><span style="font-size: 14px; font-weight: 700">{{t.day}}</span><span style="{{t.sub}}">{{t.time}}</span></button></sc-for>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #EEEAF6; border-radius: 20px; box-shadow: 0 8px 24px rgba(59, 21, 116, 0.08); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #625B73">Your problem</span><span style="font-weight: 600">Fan not working</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #625B73">Estimate</span><span style="font-weight: 600">₹400 – 700</span></div>
      <div style="font-size: 12px; color: #625B73">Final price is agreed with Murugan before work starts.</div>
    </div>
  </div>

  <div style="padding: 16px 20px 28px 20px; background: #FFFFFF; border-top: 1px solid #E8E5F0">
    <a href="RequestSent.dc.html" style="height: 56px; border-radius: 16px; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); box-shadow: 0 10px 24px rgba(76, 29, 149, 0.30); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">{{cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { slot: 0 }; }
  renderVals() {
    const slots = [{ day: 'Today', time: '4 – 6 PM' }, { day: 'Tomorrow', time: '9 – 11 AM' }];
    const cur = slots[this.state.slot];
    return {
      slots: slots.map((t, k) => ({
        day: t.day, time: t.time,
        pressed: k === this.state.slot ? 'true' : 'false',
        style: k === this.state.slot ? 'height: 60px; border-radius: 14px; border: 2px solid #4C1D95; background: #EFE9FB; font-family: inherit; color: #4C1D95; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer' : 'height: 60px; border-radius: 14px; border: 1px solid #DDD8E8; background: #FFFFFF; font-family: inherit; color: #1C1730; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer',
        sub: k === this.state.slot ? 'font-size: 12px' : 'font-size: 12px; color: #625B73',
        pick: () => this.setState({ slot: k })
      })),
      cta: 'Book Murugan · ' + cur.day + ' ' + cur.time
    };
  }
}
</script>
</body>
</html>
