<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Language</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Tamil:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4C1D95}a:hover{color:#3B1574}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #F3EEFB 0%, #F8F7FB 35%, #FFFFFF 100%); font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', sans-serif; color: #1C1730; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 22px 20px 0 20px; display: flex; align-items: center; gap: 12px">
  <a href="Profile.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #FFFFFF; border: 1px solid #E8E5F0; display: flex; align-items: center; justify-content: center; color: #1C1730"><svg style="flex-shrink: 0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
  <div style="flex-grow: 1; display: flex; flex-direction: column"><div style="font-size: 18px; font-weight: 800">Language</div><div style="font-size: 12px; color: #625B73">மொழி</div></div>
  
</div><div style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; min-height: 0; overflow-y: auto; overflow-x: hidden">

<div style="display: flex; flex-direction: column; gap: 2px; flex-shrink: 0"><div style="font-size: 14px; font-weight: 800">App language</div><span style="font-size: 12px; color: #625B73">Choose the language shown first · முதலில் காட்டப்படும் மொழி</span></div>
<div role="radiogroup" aria-label="App language" style="display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
<button role="radio" aria-checked="{{enChecked}}" onClick="{{pickEn}}" style="{{enStyle}}"><span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8E5F0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #4C1D95">Aa</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 800">English</span><span style="font-size: 12px; color: #625B73">English first, Tamil underneath</span></span><span style="{{enDot}}"></span></button>
<button role="radio" aria-checked="{{taChecked}}" onClick="{{pickTa}}" style="{{taStyle}}"><span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8E5F0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #4C1D95">அ</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 800">தமிழ்</span><span style="font-size: 12px; color: #625B73">தமிழ் முதலில், ஆங்கிலம் கீழே · Tamil first</span></span><span style="{{taDot}}"></span></button>
</div>
<div style="font-size: 14px; font-weight: 800; flex-shrink: 0">Reading and listening</div>
<div style="border: 1px solid #EEEAF6; border-radius: 20px; overflow: hidden; background: #FFFFFF; box-shadow: 0 8px 24px rgba(59, 21, 116, 0.08); display: flex; flex-direction: column; flex-shrink: 0">
<button aria-pressed="{{bothPressed}}" onClick="{{bothToggle}}" style="width: 100%; min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #FFFFFF; border: none; border-bottom: 1px solid #E8E5F0; font-family: inherit; color: #1C1730; text-align: left; cursor: pointer"><div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; background: #EFE9FB; color: #4C1D95; display: flex; align-items: center; justify-content: center"><svg style="flex-shrink: 0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg></div><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 700">Show both languages</span><span style="font-size: 12px; color: #625B73">Keep the second language in small text</span></span><span style="{{bothTrack}}"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></button>
<button aria-pressed="{{voicePressed}}" onClick="{{voiceToggle}}" style="width: 100%; min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #FFFFFF; border: none; border-bottom: 1px solid #E8E5F0; font-family: inherit; color: #1C1730; text-align: left; cursor: pointer"><div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; background: #EFE9FB; color: #4C1D95; display: flex; align-items: center; justify-content: center"><svg style="flex-shrink: 0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg></div><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 700">Read job details aloud</span><span style="font-size: 12px; color: #625B73">Voice in your chosen language</span></span><span style="{{voiceTrack}}"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></button>
<button aria-pressed="{{largePressed}}" onClick="{{largeToggle}}" style="width: 100%; min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #FFFFFF; border: none; border-bottom: 1px solid #E8E5F0; font-family: inherit; color: #1C1730; text-align: left; cursor: pointer"><div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; background: #EFE9FB; color: #4C1D95; display: flex; align-items: center; justify-content: center"><svg style="flex-shrink: 0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg></div><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 700">Larger text</span><span style="font-size: 12px; color: #625B73">Easier to read on small phones</span></span><span style="{{largeTrack}}"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></button>
</div>
<div style="font-size: 12px; color: #625B73; text-align: center; flex-shrink: 0">You can change this any time from Profile.</div>

</div><div style="padding: 14px 20px 26px 20px; background: #FFFFFF; border-top: 1px solid #E8E5F0; display: flex; flex-direction: column; gap: 10px"><a href="Profile.dc.html" style="height: 56px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); box-shadow: 0 10px 24px rgba(76, 29, 149, 0.30); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box">Save</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: 0, both: true, voice: true, large: false }; }
  renderVals() {
    const s = this.state;
    const on = 'width: 100%; border-radius: 18px; border: 2px solid #4C1D95; background: #EFE9FB; padding: 14px; display: flex; align-items: center; gap: 12px; font-family: inherit; color: #1C1730; text-align: left; cursor: pointer';
    const off = 'width: 100%; border-radius: 18px; border: 1px solid #DDD8E8; background: #FFFFFF; padding: 14px; display: flex; align-items: center; gap: 12px; font-family: inherit; color: #1C1730; text-align: left; cursor: pointer';
    const dotOn = 'width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 11px; border: 7px solid #4C1D95; background: #FFFFFF';
    const dotOff = 'width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 11px; border: 2px solid #DDD8E8; background: #FFFFFF';
    return {
      enStyle: s.lang === 0 ? on : off, taStyle: s.lang === 1 ? on : off,
      enDot: s.lang === 0 ? dotOn : dotOff, taDot: s.lang === 1 ? dotOn : dotOff,
      enChecked: s.lang === 0 ? 'true' : 'false', taChecked: s.lang === 1 ? 'true' : 'false',
      pickEn: () => this.setState({ lang: 0 }), pickTa: () => this.setState({ lang: 1 }),
      bothPressed: s.both ? 'true' : 'false',
      bothTrack: s.both ? 'width: 52px; height: 30px; flex-shrink: 0; border-radius: 15px; background: #4C1D95; display: flex; align-items: center; justify-content: flex-end; padding: 3px; box-sizing: border-box' : 'width: 52px; height: 30px; flex-shrink: 0; border-radius: 15px; background: #CFC9DC; display: flex; align-items: center; justify-content: flex-start; padding: 3px; box-sizing: border-box',
      bothToggle: () => this.setState({ both: !this.state.both }),
      voicePressed: s.voice ? 'true' : 'false',
      voiceTrack: s.voice ? 'width: 52px; height: 30px; flex-shrink: 0; border-radius: 15px; background: #4C1D95; display: flex; align-items: center; justify-content: flex-end; padding: 3px; box-sizing: border-box' : 'width: 52px; height: 30px; flex-shrink: 0; border-radius: 15px; background: #CFC9DC; display: flex; align-items: center; justify-content: flex-start; padding: 3px; box-sizing: border-box',
      voiceToggle: () => this.setState({ voice: !this.state.voice }),
      largePressed: s.large ? 'true' : 'false',
      largeTrack: s.large ? 'width: 52px; height: 30px; flex-shrink: 0; border-radius: 15px; background: #4C1D95; display: flex; align-items: center; justify-content: flex-end; padding: 3px; box-sizing: border-box' : 'width: 52px; height: 30px; flex-shrink: 0; border-radius: 15px; background: #CFC9DC; display: flex; align-items: center; justify-content: flex-start; padding: 3px; box-sizing: border-box',
      largeToggle: () => this.setState({ large: !this.state.large }),
    };
  }
}
</script>
</body>
</html>
