<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schedule a time</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Tamil:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4C1D95}a:hover{color:#3B1574}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #F3EEFB 0%, #F8F7FB 35%, #FFFFFF 100%); font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', sans-serif; color: #1C1730; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 22px 20px 0 20px; display: flex; align-items: center; gap: 12px">
  <a href="Post.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #FFFFFF; border: 1px solid #E8E5F0; display: flex; align-items: center; justify-content: center; color: #1C1730"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
  <div style="flex-grow: 1; display: flex; flex-direction: column"><div style="font-size: 18px; font-weight: 800">Schedule a time</div><div style="font-size: 12px; color: #625B73">நேரத்தைத் தேர்வு செய்யுங்கள்</div></div>
  
</div><div style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; min-height: 0; overflow-y: auto; overflow-x: hidden">

<div style="font-size: 14px; font-weight: 800">Day <span style="font-weight: 500; color: #625B73">· நாள்</span></div>
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px 2px; margin: 0 -2px" role="group" aria-label="Day"><sc-for list="{{days}}" as="d" hint-placeholder-count="7"><button aria-label="{{d.label}}" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" style="{{d.style}}"><span style="font-size: 12px; font-weight: 700">{{d.top}}</span><span style="font-size: 20px; font-weight: 800; line-height: 1">{{d.num}}</span><span style="{{d.taStyle}}">{{d.ta}}</span></button></sc-for></div>
<div style="font-size: 14px; font-weight: 800">Time <span style="font-weight: 500; color: #625B73">· நேரம்</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; font-weight: 700; color: #625B73">Morning · காலை</div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><sc-for list="{{morning}}" as="t" hint-placeholder-count="2"><button aria-pressed="{{t.pressed}}" aria-disabled="{{t.disabled}}" onClick="{{t.pick}}" style="{{t.style}}"><span style="font-size: 14px; font-weight: 700">{{t.label}}</span><span style="{{t.subStyle}}">{{t.sub}}</span></button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; font-weight: 700; color: #625B73">Afternoon · மதியம்</div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><sc-for list="{{afternoon}}" as="t" hint-placeholder-count="2"><button aria-pressed="{{t.pressed}}" aria-disabled="{{t.disabled}}" onClick="{{t.pick}}" style="{{t.style}}"><span style="font-size: 14px; font-weight: 700">{{t.label}}</span><span style="{{t.subStyle}}">{{t.sub}}</span></button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; font-weight: 700; color: #625B73">Evening · மாலை</div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><sc-for list="{{evening}}" as="t" hint-placeholder-count="2"><button aria-pressed="{{t.pressed}}" aria-disabled="{{t.disabled}}" onClick="{{t.pick}}" style="{{t.style}}"><span style="font-size: 14px; font-weight: 700">{{t.label}}</span><span style="{{t.subStyle}}">{{t.sub}}</span></button></sc-for></div></div>
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 12px; color: #625B73; line-height: 1.4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#625B73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><span>Book at least 2 hours ahead. The worker may arrive any time within the window.</span></div>

</div><div style="padding: 14px 20px 26px 20px; background: #FFFFFF; border-top: 1px solid #E8E5F0; display: flex; flex-direction: column; gap: 10px"><div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span style="color: #625B73">Your time</span><span style="font-weight: 800">{{summary}}</span></div><a href="{{ctaHref}}" aria-disabled="{{ctaDisabled}}" style="{{ctaStyle}}">{{cta}}</a><sc-if value="{{missing}}" hint-placeholder-val="{{ true }}"><div style="font-size: 12px; color: #625B73; text-align: center">{{missingText}}</div></sc-if></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 1, slot: 1 }; }
  renderVals() {
    const s = this.state;
    const now = new Date();
    const en = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const ta = ['ஞாயி', 'திங்', 'செவ்', 'புத', 'வியா', 'வெள்', 'சனி'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
      days.push({ i, top: i === 0 ? 'Today' : i === 1 ? 'Tmrw' : en[d.getDay()], ta: ta[d.getDay()], num: String(d.getDate()), long: (i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : en[d.getDay()]) + ' ' + d.getDate() + ' ' + months[d.getMonth()] });
    }
    const slotsDef = [
      { start: 8, label: '8 – 10 AM', part: 0 }, { start: 10, label: '10 AM – 12 PM', part: 0 },
      { start: 12, label: '12 – 2 PM', part: 1 }, { start: 14, label: '2 – 4 PM', part: 1 },
      { start: 16, label: '4 – 6 PM', part: 2 }, { start: 18, label: '6 – 8 PM', part: 2 }
    ];
    // Unavailable: already passed today (needs 2 hours' notice), or no workers free (sample pattern).
    const state = (dayI, k) => {
      if (dayI === 0 && slotsDef[k].start < now.getHours() + 2) return 'Passed';
      if ((dayI * 3 + k) % 7 === 5) return 'Full';
      return '';
    };
    const mk = (part) => slotsDef.map((d, k) => Object.assign({}, d, { k })).filter((d) => d.part === part).map((d) => {
      const na = state(s.day, d.k);
      const on = !na && s.slot === d.k;
      return {
        label: d.label,
        sub: na || (on ? 'Selected' : 'Available'),
        pressed: on ? 'true' : 'false',
        disabled: na ? 'true' : 'false',
        style: na ? 'height: 56px; border-radius: 14px; border: 1px dashed #DDD8E8; background: #F8F7FB; color: #8A82A0; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: not-allowed' : on ? 'height: 56px; border-radius: 14px; border: 2px solid #4C1D95; background: #EFE9FB; color: #4C1D95; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer' : 'height: 56px; border-radius: 14px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #1C1730; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer',
        subStyle: na ? 'font-size: 11px; color: #8A82A0' : on ? 'font-size: 11px; font-weight: 700; color: #4C1D95' : 'font-size: 11px; color: #625B73',
        pick: () => { if (!na) this.setState({ slot: d.k }); }
      };
    });
    const chosenOk = s.slot >= 0 && !state(s.day, s.slot);
    const missing = chosenOk ? '' : 'Choose an available time';
    return {
      days: days.map((d) => ({
        top: d.top, ta: d.ta, num: d.num,
        label: 'Choose ' + d.long,
        pressed: d.i === s.day ? 'true' : 'false',
        style: d.i === s.day ? 'flex-shrink: 0; width: 64px; height: 76px; border-radius: 16px; border: 2px solid #4C1D95; background: #4C1D95; color: #FFFFFF; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; box-shadow: 0 8px 18px rgba(76, 29, 149, 0.25)' : 'flex-shrink: 0; width: 64px; height: 76px; border-radius: 16px; border: 1px solid #DDD8E8; background: #FFFFFF; color: #1C1730; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer',
        taStyle: d.i === s.day ? 'font-size: 10px; color: #DDD3F5' : 'font-size: 10px; color: #625B73',
        pick: () => this.setState({ day: d.i, slot: -1 })
      })),
      morning: mk(0), afternoon: mk(1), evening: mk(2),
      summary: chosenOk ? days[s.day].long + ' · ' + slotsDef[s.slot].label : 'No time chosen yet',
      cta: 'Confirm time',
      missing: missing !== '',
      missingText: missing,
      ctaHref: missing === '' ? 'Post.dc.html' : '#',
      ctaDisabled: missing === '' ? 'false' : 'true',
      ctaStyle: missing === '' ? 'height: 56px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); box-shadow: 0 10px 24px rgba(76, 29, 149, 0.30); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box' : 'height: 56px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6A3BB5 0%, #4C1D95 60%, #3B1574 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 16px; font-weight: 700; text-decoration: none; cursor: default; opacity: 0.5; pointer-events: none; box-sizing: border-box',
    };
  }
}
</script>
</body>
</html>
